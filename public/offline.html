<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 상태</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #10b981; }
    p { color: #94a3b8; }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>인터넷 연결 끊김</h1>
  <p>현재 기기가 오프라인 상태입니다.<br>네트워크 연결을 확인한 후 다시 시도해주세요.</p>
  <button onclick="window.location.reload()">새로고침</button>
</body>
</html>
